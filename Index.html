<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La main de Dieu — Tactus SMC</title>
    <style>
        :root {
            --bg-dark: #070712;
            --card-bg: #111122;
            --neon-purple: #9d4edd;
            --neon-glow: rgba(157, 78, 221, 0.4);
            --text-main: #ffffff;
            --text-muted: #a0a0c0;
            --border-color: #242442;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px var(--neon-glow);
        }
        h1 {
            color: var(--neon-purple);
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--neon-glow);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        select, input[type="file"] {
            width: 100%;
            background: var(--bg-dark);
            color: var(--text-main);
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .upload-box {
            border: 2px dashed var(--neon-purple);
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            background: var(--bg-dark);
            margin-bottom: 20px;
        }
        button {
            background: var(--neon-purple);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 0 10px var(--neon-glow);
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        .results {
            margin-top: 20px;
            background: var(--bg-dark);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none;
        }
        .results h3 {
            color: var(--neon-purple);
            margin-top: 0;
            font-size: 1.1rem;
        }
        .results p {
            margin: 8px 0;
            font-size: 0.95rem;
        }
        .disclaimer {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>La main de Dieu — Tactus SMC</h1>
        
        <div class="form-group">
            <label for="session">Session Institutionnelle :</label>
            <select id="session">
                <option value="New York">New York</option>
                <option value="London">London</option>
                <option value="Asia">Asia</option>
            </select>
        </div>

        <div class="upload-box">
            <label for="chartInput">Importer un screenshot de graphique :</label>
            <input type="file" id="chartInput" accept="image/*">
        </div>

        <button onclick="runAnalysis()">Lancer l'analyse SMC</button>
        
        <div class="results" id="resultsPanel">
            <h3>Résultat de l'Analyse SMC</h3>
            <p><strong>Verdict :</strong> <span id="verdictText"></span></p>
            <p><strong>Confiance :</strong> <span id="starRating">★★★★☆ (4/5)</span></p>
            <p><strong>Zone d'Entrée :</strong> <span id="entryPrice">--</span></p>
            <p><strong>Take Profit (TP) :</strong> <span id="tpPrice">--</span></p>
            <p><strong>Stop Loss (SL) :</strong> <span id="slPrice">--</span></p>
        </div>

        <div class="disclaimer">
            Avertissement : Outil de simulation SMC. Ne constitue pas un conseil financier réel.
        </div>
    </div>

    <script>
        function runAnalysis() {
            const panel = document.getElementById('resultsPanel');
            const verdicts = [
                "BULLISH ORDER BLOCK + FVG DÉTECTÉ", 
                "BEARISH BREAK OF STRUCTURE (CHoCH)", 
                "SWEEP DE LIQUIDITÉ + MITIGATION BLOCK"
            ];
            
            document.getElementById('verdictText').innerText = verdicts[Math.floor(Math.random() * verdicts.length)];
            document.getElementById('entryPrice').innerText = (Math.random() * 2000 + 1000).toFixed(2);
            document.getElementById('tpPrice').innerText = (Math.random() * 2000 + 1200).toFixed(2);
            document.getElementById('slPrice').innerText = (Math.random() * 2000 + 800).toFixed(2);
            
            panel.style.display = 'block';
        }
    </script>
</body>
</html>
